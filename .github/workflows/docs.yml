name: Build and Deploy Docs

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'n64/engine/include/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'n64/engine/include/**'

jobs:
  docs:
    uses: HailToDodongo/n64-docs/.github/workflows/docs.yml@main
    permissions:
      pages: write
      id-token: write
    with:
      docs-dir: docs
